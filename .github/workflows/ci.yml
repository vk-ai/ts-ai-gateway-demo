# Mirror of a GitHub Actions workflow.
# Copy to .github/workflows/ci.yml if your token has the workflow scope.
# PAT pushes often lack workflow scope — this file under ci/ is always pushable.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Offline only — no OPENAI_API_KEY required
      - name: Smoke start (mock provider)
        run: |
          node dist/index.js &
          PID=$!
          sleep 1
          curl -sf http://localhost:3000/health | grep -q '"ok": true'
          curl -sf -X POST http://localhost:3000/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"What is the return window?"}' | grep -q '"answer"'
          kill $PID
      - name: Smoke per-key quota (429 + Retry-After)
        run: |
          PORT=3001 KEY_RPM=1 node dist/index.js &
          PID=$!
          sleep 1
          body='{"message":"What is the return window?"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3001/chat -H 'x-api-key: ci' -H 'Content-Type: application/json' -d "$body")" = 200
          curl -s -D /tmp/h.txt -o /dev/null -X POST http://localhost:3001/chat -H 'x-api-key: ci' -H 'Content-Type: application/json' -d "$body"
          head -1 /tmp/h.txt | grep -q ' 429'
          grep -qi '^retry-after: 60' /tmp/h.txt
          kill $PID
